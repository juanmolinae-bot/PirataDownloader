name: Compilar APK de PirataDownloader

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            automake gettext

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer cython setuptools

      - name: Cachear SDK/NDK de Android
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Compilar APK
        run: |
          yes | buildozer android debug
        env:
          BUILDOZER_LOG_LEVEL: 2

      - name: Subir el APK generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PirataDownloader-apk
          path: bin/*.apk
